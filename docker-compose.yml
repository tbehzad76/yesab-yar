services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesabyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hesabyar}
      POSTGRES_DB: ${POSTGRES_DB:-hesabyar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:3002:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-hesabyar} -d ${POSTGRES_DB:-hesabyar}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesabyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hesabyar}
      POSTGRES_DB: ${POSTGRES_DB:-hesabyar}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALGORITHM: ${ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hesabyar.jahansg.ir}
      PROJECT_NAME: ${PROJECT_NAME:-Hesabyar API}
      DEBUG: ${DEBUG:-false}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-IRT}
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - default
      - myapp_net

volumes:
  pgdata:

networks:
  myapp_net:
    external: true
    name: myapp_net
