services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesabyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hesabyar}
      POSTGRES_DB: ${POSTGRES_DB:-hesabyar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # فقط روی لوکال‌هاست باز است (برای ابزارهای مدیریت دیتابیس روی سرور)
      - "127.0.0.1:3002:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hesabyar} -d ${POSTGRES_DB:-hesabyar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesabyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hesabyar}
      POSTGRES_DB: ${POSTGRES_DB:-hesabyar}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALGORITHM: ${ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PROJECT_NAME: ${PROJECT_NAME:-Hesabyar API}
      DEBUG: ${DEBUG:-true}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-IRT}
    ports:
      - "3001:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
